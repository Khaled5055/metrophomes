<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Metropolis Homes Real Estate | metrophomes.com</title>
  <meta name="description" content="Metropolis Homes Real Estate in Egypt — primary market specialists, resale experts, commercial consultancy, and property management with a motto of Communication, Trust & High Returns." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cairo:wght@400;600;700;800&family=Cormorant+Garamond:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #0f1c2e;
      --navy-soft: #1b2e47;
      --gold: #b88b28;
      --gold-light: #f5efe2;
      --ink: #1e293b;
      --muted: #526071;
      --bg: #ffffff;
      --surface: #f8fafc;
      --border: #e2e8f0;
      --fb: #1877f2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Plus Jakarta Sans", "Cairo", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--ink);
      background-color: var(--bg);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    body[dir="rtl"] {
      font-family: "Cairo", "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.8;
      text-align: right;
    }

    h1, h2, .serif-brand {
      font-family: "Cormorant Garamond", Georgia, serif;
      letter-spacing: -0.01em;
    }

    body[dir="rtl"] h1,
    body[dir="rtl"] h2,
    body[dir="rtl"] .serif-brand {
      font-family: "Amiri", "Cairo", serif;
      letter-spacing: 0;
    }

    .container {
      max-width: 1140px;
      margin: 0 auto;
      padding: 0 24px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(255, 255, 255, 0.97);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 86px;
      gap: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
      color: var(--navy);
      flex-shrink: 0;
    }

    .brand img {
      height: 54px;
      width: auto;
      max-width: 185px;
      object-fit: contain;
      display: block;
    }

    .brand-divider {
      width: 1px;
      height: 32px;
      background: var(--border);
    }

    .brand-tagline {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: var(--gold);
    }

    body[dir="rtl"] .brand-tagline {
      letter-spacing: 0;
      font-size: 0.8rem;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 22px;
    }

    .nav-links {
      display: flex;
      list-style: none;
      gap: 20px;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--ink);
      font-size: 0.92rem;
      font-weight: 600;
      transition: color 0.2s ease;
    }

    .nav-links a:hover {
      color: var(--gold);
    }

    .lang-switch {
      display: inline-flex;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      background: var(--surface);
    }

    .lang-btn {
      border: none;
      background: transparent;
      color: var(--ink);
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 700;
      padding: 7px 12px;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .lang-btn.active {
      background: var(--navy);
      color: #ffffff;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 22px;
      border-radius: 6px;
      font-size: 0.92rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--navy);
      color: #ffffff;
      border: 1px solid var(--navy);
    }

    .btn-primary:hover {
      background: var(--navy-soft);
    }

    .btn-accent {
      background: var(--gold);
      color: #ffffff;
      border: 1px solid var(--gold);
    }

    .btn-accent:hover {
      filter: brightness(0.95);
    }

    .btn-fb {
      background: var(--fb);
      color: #ffffff;
      border: 1px solid var(--fb);
    }

    .btn-fb:hover {
      filter: brightness(0.94);
    }

    .btn-outline {
      background: transparent;
      color: var(--navy);
      border: 1px solid var(--border);
    }

    .btn-outline:hover {
      border-color: var(--navy);
      background: var(--surface);
    }

    .hero {
      padding: 78px 0 72px;
      background:
        radial-gradient(circle at 90% 15%, rgba(184, 139, 40, 0.08), transparent 42%),
        linear-gradient(180deg, #f8fafc 0%, #ffffff 100%);
      border-bottom: 1px solid var(--border);
    }

    body[dir="rtl"] .hero {
      background:
        radial-gradient(circle at 10% 15%, rgba(184, 139, 40, 0.08), transparent 42%),
        linear-gradient(180deg, #f8fafc 0%, #ffffff 100%);
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.32fr 0.68fr;
      gap: 44px;
      align-items: center;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--gold);
      background: var(--gold-light);
      padding: 6px 13px;
      border-radius: 999px;
      margin-bottom: 18px;
    }

    body[dir="rtl"] .eyebrow {
      letter-spacing: 0;
      font-size: 0.84rem;
    }

    .hero h1 {
      font-size: clamp(2.25rem, 4.3vw, 3.45rem);
      line-height: 1.12;
      color: var(--navy);
      font-weight: 700;
      margin-bottom: 18px;
    }

    body[dir="rtl"] .hero h1 {
      line-height: 1.2;
    }

    .hero p {
      font-size: 1.05rem;
      color: var(--muted);
      max-width: 640px;
      margin-bottom: 28px;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
    }

    .hero-panel {
      background: var(--navy);
      color: #ffffff;
      border-radius: 14px;
      padding: 30px 26px;
      box-shadow: 0 18px 40px -18px rgba(15, 28, 46, 0.35);
    }

    .hero-panel-label {
      font-size: 0.76rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #e5c479;
      font-weight: 700;
      margin-bottom: 16px;
      display: block;
    }

    body[dir="rtl"] .hero-panel-label {
      letter-spacing: 0;
      font-size: 0.85rem;
    }

    .markets-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .markets-list li {
      padding-bottom: 13px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }

    .markets-list li:last-child {
      padding-bottom: 0;
      border-bottom: none;
    }

    .markets-list strong {
      display: block;
      font-size: 1rem;
      color: #ffffff;
      margin-bottom: 2px;
    }

    .markets-list span {
      font-size: 0.88rem;
      color: #cbd5e1;
    }

    section {
      padding: 76px 0;
    }

    .section-header {
      max-width: 720px;
      margin-bottom: 40px;
    }

    .section-title {
      font-size: clamp(1.9rem, 3vw, 2.55rem);
      color: var(--navy);
      font-weight: 700;
      line-height: 1.18;
      margin-bottom: 12px;
    }

    .section-subtitle {
      color: var(--muted);
      font-size: 1rem;
    }

    .about-narrative {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 32px;
      align-items: start;
      margin-bottom: 36px;
    }

    .narrative-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 32px;
    }

    .narrative-box p {
      font-size: 0.98rem;
      color: var(--ink);
      margin-bottom: 16px;
    }

    .narrative-box p:last-child {
      margin-bottom: 0;
    }

    .motto-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }

    .motto-pill {
      background: #ffffff;
      border: 1px solid var(--border);
      color: var(--navy);
      font-size: 0.85rem;
      font-weight: 700;
      padding: 7px 14px;
      border-radius: 999px;
    }

    .vm-stack {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .vm-card {
      background: var(--navy);
      color: #ffffff;
      border-radius: 14px;
      padding: 26px 28px;
    }

    .vm-card.gold-border {
      background: #ffffff;
      color: var(--ink);
      border: 1px solid var(--border);
      border-top: 3px solid var(--gold);
    }

    .vm-tag {
      display: inline-block;
      font-size: 0.76rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #e5c479;
      margin-bottom: 8px;
    }

    .vm-card.gold-border .vm-tag {
      color: var(--gold);
    }

    body[dir="rtl"] .vm-tag {
      letter-spacing: 0;
      font-size: 0.82rem;
    }

    .vm-card h3 {
      font-size: 1.25rem;
      margin-bottom: 8px;
    }

    .vm-card p {
      font-size: 0.94rem;
      color: #cbd5e1;
    }

    .vm-card.gold-border p {
      color: var(--muted);
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }

    .card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 24px -16px rgba(15, 28, 46, 0.2);
    }

    .service-card {
      padding: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .service-media {
      width: 100%;
      aspect-ratio: 16 / 10;
      overflow: hidden;
      background: #e2e8f0;
    }

    .service-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .service-body {
      padding: 24px 26px 28px;
    }

    .card-num {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--gold);
      margin-bottom: 10px;
      letter-spacing: 0.08em;
    }

    body[dir="rtl"] .card-num {
      letter-spacing: 0;
    }

    .card h3 {
      font-size: 1.14rem;
      color: var(--navy);
      font-weight: 700;
      margin-bottom: 10px;
    }

    .card p {
      font-size: 0.94rem;
      color: var(--muted);
    }

    .surface-band {
      background: var(--surface);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    .contact-card {
      background: var(--navy);
      color: #ffffff;
      border-radius: 16px;
      padding: 42px;
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: space-between;
      gap: 28px;
    }

    .contact-info-block {
      flex: 1 1 560px;
    }

    .contact-card h2 {
      color: #ffffff;
      font-size: clamp(1.85rem, 3vw, 2.4rem);
      margin-bottom: 8px;
    }

    .contact-card p {
      color: #cbd5e1;
      font-size: 0.96rem;
      margin-bottom: 18px;
    }

    .contact-details-grid {
      display: flex;
      flex-direction: column;
      gap: 11px;
      font-size: 0.94rem;
      color: #e2e8f0;
    }

    .contact-row {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 8px 14px;
    }

    .contact-label {
      color: #94a3b8;
      font-weight: 600;
    }

    .contact-card a {
      color: #f3d286;
      text-decoration: none;
      font-weight: 600;
    }

    .contact-card a:hover {
      text-decoration: underline;
    }

    .contact-card a.btn {
      color: #ffffff;
      text-decoration: none;
    }

    .ltr-num {
      direction: ltr;
      unicode-bidi: embed;
      display: inline-block;
    }

    .contact-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-self: center;
      min-width: 240px;
    }

    footer {
      padding: 30px 0;
      border-top: 1px solid var(--border);
      background: var(--bg);
    }

    .footer-inner {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      font-size: 0.88rem;
      color: var(--muted);
    }

    .footer-right {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 20px;
    }

    .footer-links {
      display: flex;
      gap: 20px;
    }

    .footer-links a {
      color: var(--ink);
      text-decoration: none;
      font-weight: 600;
    }

    .footer-links a:hover {
      color: var(--gold);
    }

    .footer-fb-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--fb) !important;
    }

    @media (max-width: 980px) {
      .hero-grid,
      .about-narrative {
        grid-template-columns: 1fr;
      }

      .grid-3 {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 720px) {
      .nav-links,
      .brand-divider,
      .brand-tagline {
        display: none;
      }

      .grid-3 {
        grid-template-columns: 1fr;
      }

      .contact-card {
        padding: 28px 22px;
      }

      .contact-actions {
        width: 100%;
      }
    }
  </style>
</head>
